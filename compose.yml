services:
  db:
    image: tharuna1/database:v4
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    volumes:
      - db_data:/var/lib/mysql

  auth_service:
    image: tharuna1/borrow:v1
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    volumes:
      - app_data:/murali
    depends_on:
      - db

  book_service:
    image: tharuna1/book:v2
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    volumes:
      - app_data:/murali
    depends_on:
      - db

  borrow_service:
    image: tharuna1/borrow:v3
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    volumes:
      - app_data:/murali
    depends_on:
      - db

  frontend:
    image: tharuna1/frontened:v5
    deploy:
      replicas: 1
    ports:
      - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay

volumes:
  db_data:
  app_data:
